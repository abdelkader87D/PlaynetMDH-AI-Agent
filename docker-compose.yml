version: '3.8'
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: [".:/app"]
  dashboard:
    build: .
    command: streamlit run frontend/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
